[project]
name = "motor"
version = "0.1.0"
description = "Buckingham Pi analysis and plotting for motor experiment data"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10,<4",
    "mlxtend>=0.25.0",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.9.1",
    "scipy>=1.15,<2",
    "torch>=2.14.1",
]

[project.scripts]
model = "motor.model:main"
prepare-data = "motor.preprocessing:main"
neural-network = "motor.neural_network:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
