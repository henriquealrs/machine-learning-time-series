[project]
name = "machine-learning-time-series"
version = "0.1.0"
description = "Load vehicle time-series data from Excel and plot selected attributes."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.10.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pyqt6>=6.11.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
