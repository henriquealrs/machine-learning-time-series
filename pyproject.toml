[project]
name = "motor"
version = "0.1.0"
description = "Buckingham Pi analysis and plotting for motor experiment data"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.9.1",
    "scipy>=1.15,<2",
]

[project.scripts]
model = "motor.model:main"
prepare-data = "motor.preprocessing:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
